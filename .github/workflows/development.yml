name: Development build

on:
  pull_request:
    branches-ignore:
      - 'l10n_main'
    types: [opened, reopened]
  push:
    branches-ignore:
      - 'l10n_main'
  workflow_dispatch:

jobs:
  build:
    name: Development build
    strategy:
      matrix:
        include:
          - platform: 2
            platform_name: ios
    
    runs-on: macos-latest
    steps:
      - name: Remove work folders
        run: |
          echo "before"
          ls -lah ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          echo "after"
          ls -lah ./
          
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Checkout repository submodules
        env:
          GIT_LFS_SKIP_SMUDGE: 1
        run: |
          git lfs install --skip-smudge
          git config --global filter.lfs.smudge "git-lfs smudge --skip -- %f"
          git config --global filter.lfs.process "git-lfs filter-process --skip"

          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Setup Xcode Version
        uses: maxim-lobanov/setup-xcode@master
        with:
          xcode-version: '26.5'

      - name: Install Dependencies
        run: brew install make ldid temurin@8

      - name: Get gl4es latest commit hash
        id: gl4es-sha
        run: echo "::set-output name=sha::$(echo $(git ls-remote https://github.com/PojavLauncherTeam/gl4es-114-extra refs/heads/master | grep -io '^\S*'))"
        shell: bash

      - name: Cache gl4es
        uses: actions/cache@main
        if: false # use gl4es 1.1.5
        id: gl4es-cache
        with:
          path: gl4es/libs
          key: gl4es-holy-ios-shared-2-${{ steps.gl4es-sha.outputs.sha }}

      - name: Get gl4es
        if: false && steps.gl4es-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@main
        with:
          repository: 'PojavLauncherTeam/gl4es-114-extra'
          path: 'gl4es'

      - name: Build gl4es
        if: false && steps.gl4es-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          cd gl4es
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "github-actions"
          export PATH=/opt/procursus/bin:$PATH
          wget https://github.com/leetal/ios-cmake/raw/master/ios.toolchain.cmake
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake -DDEFAULT_ES=2 \
            -DNOX11=ON -DNOEGL=OFF -DSTATICLIB=OFF -DPLATFORM=OS64 \
            -DCMAKE_C_FLAGS=-Wno-error=implicit-function-declaration
          cmake --build build --config RelWithDebInfo --target GL
          cp -R lib/libGL.dylib ../Natives/resources/Frameworks/libgl4es_114.dylib
          
      - name: Push gl4es
        if: false && github.event != 'pull_request' && github.ref_name == 'main' && steps.gl4es-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          git add Natives/resources/Frameworks/libgl4es_114.dylib
          git commit -am "CI: Update gl4es"
          git push

      - name: Set up JDK 25
        if: matrix.platform_name == 'ios'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build Java 25 iOS runtime from source
        if: matrix.platform_name == 'ios'
        env:
          BUILD_IOS: "1"
          TARGET_VERSION: "25"
          J316SAP: "1"
        run: |
          set -euo pipefail
          brew install autoconf automake ldid wget gnu-sed coreutils
          git clone https://github.com/AngelAuraMC/angelauramc-openjdk-build.git recipe
          cd recipe
          git checkout 3f41bcabf703fc5bfd75492b0ed713a73dd86541
          git clone --depth 1 --branch "jdk-25.0.5.0.3-ga" https://github.com/openjdk/jdk25u openjdk-25
          printf '%s\n' '#!/bin/bash' 'echo "jdk25u already cloned at pinned tag"' > 5_clonejdk.sh
          chmod +x 5_clonejdk.sh
          cd openjdk-25
          for patch in ../patches/jre_25/ios/1_jdk25u_ios.diff ../patches/jre_25/ios/2_mirror_mapping.diff; do
            git apply --check "$patch"
            git apply --reject --whitespace=fix "$patch"
          done
          test "$(find . -name '*.rej' | wc -l | tr -d ' ')" -eq 0
          git checkout -q -f .
          git clean -qfd
          cd ..
          export JAVA_HOME=$(/usr/libexec/java_home -v 25)
          export PATH=/opt/homebrew/bin:$PATH
          bash 1_ci_build_arch_aarch64.sh 2>&1 | tee ../java25-ios-build.log | tail -400
          ARCHIVE="$(find . -maxdepth 1 -type f -name 'jre25-ios*.tar.xz' -print -quit)"
          test -n "$ARCHIVE"
          mkdir -p ../depends/java-25-openjdk
          TEMP_JRE="$(mktemp -d)"
          tar -xf "$ARCHIVE" -C "$TEMP_JRE"
          RELEASE_FILE="$(find "$TEMP_JRE" -type f -name release -print -quit)"
          test -n "$RELEASE_FILE"
          cp -R "$(dirname "$RELEASE_FILE")/." ../depends/java-25-openjdk/
          test -f ../depends/java-25-openjdk/lib/server/libjvm.dylib
          grep -E 'JAVA_VERSION|OS_ARCH|OS_NAME' ../depends/java-25-openjdk/release
          cd ..
          rm -rf "$TEMP_JRE" recipe

      - name: Build for ${{ matrix.platform_name }}
        run: |
          export PATH=/opt/homebrew/bin:$PATH
          export SLIMMED=1
          if [ "${{ matrix.platform_name }}" == "ios" ]; then
            # Build ipa and tipa for iOS
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} JRE_VERSIONS=25
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} JRE_VERSIONS=25 TROLLSTORE_JIT_ENT=1
          elif [ "${{ matrix.platform_name }}" == "tvos" ]; then
            # Build tipa only for tvOS
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} JRE_VERSIONS=25 TROLLSTORE_JIT_ENT=1
          else
            # Build ipa only for everything else
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} JRE_VERSIONS=25
          fi

      - name: Upload regular ipa
        uses: actions/upload-artifact@main
        with:
          name: org.angelauramc.amethyst-${{ matrix.platform_name }}.ipa
          path: artifacts/org.angelauramc.amethyst-*-${{ matrix.platform_name }}.ipa

      - name: Upload regular tipa
        uses: actions/upload-artifact@main
        with:
          name: org.angelauramc.amethyst-${{ matrix.platform_name }}-trollstore.tipa
          path: artifacts/org.angelauramc.amethyst-*-${{ matrix.platform_name }}-trollstore.tipa

      - name: Upload slimmed ipa
        uses: actions/upload-artifact@main
        with:
          name: org.angelauramc.amethyst.slimmed-${{ matrix.platform_name }}.ipa
          path: artifacts/org.angelauramc.amethyst.slimmed-*-${{ matrix.platform_name }}.ipa

      - name: Upload slimmed tipa
        uses: actions/upload-artifact@main
        with:
          name: org.angelauramc.amethyst.slimmed-${{ matrix.platform_name }}-trollstore.tipa
          path: artifacts/org.angelauramc.amethyst.slimmed-*-${{ matrix.platform_name }}-trollstore.tipa

      - name: Upload PojavLauncher.dSYM
        uses: actions/upload-artifact@main
        if: matrix.platform_name == 'ios'
        with:
          name: AngelAuraAmethyst.dSYM
          path: artifacts/AngelAuraAmethyst.dSYM
